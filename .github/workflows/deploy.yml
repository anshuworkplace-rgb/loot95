name: Loot 95 Multi-Cloud CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-verify:
    name: Build & Verify Production Bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Typecheck TypeScript
        run: npx tsc -b

      - name: Build Frontend & Server
        run: npm run build

      - name: Verify Distribution Output
        run: |
          test -d dist || (echo "dist directory missing!" && exit 1)
          test -f dist/index.html || (echo "Vite index.html missing!" && exit 1)
          test -f dist/server.js || (echo "Server bundle missing!" && exit 1)
          echo "✅ Build outputs verified successfully!"
